    <script>
        // ============================================================
        // CART - FIXED (load cart and clear stale count)
        // ============================================================
        function loadCart() {
            try {
                const saved = localStorage.getItem('hayatCart');
                if (saved) {
                    cart = JSON.parse(saved);
                    // Filter out items with qty <= 0
                    cart = cart.filter(item => item.qty > 0);
                } else {
                    cart = [];
                }
            } catch (e) {
                cart = [];
            }
            // Save filtered cart back to localStorage
            localStorage.setItem('hayatCart', JSON.stringify(cart));
            // Update UI immediately
            updateCartUI();
        }

        function saveCart() { 
            cart = cart.filter(item => item.qty > 0);
            localStorage.setItem('hayatCart', JSON.stringify(cart)); 
            updateCartUI(); 
        }

        function updateCartUI() {
            cart = cart.filter(item => item.qty > 0);
            const totalItems = cart.reduce((sum, i) => sum + (i.qty || 0), 0);
            document.getElementById('cartCount').textContent = totalItems;
            renderCartItems();
        }

        ... rest of JavaScript ...

        // In init function, call loadCart() before other renders
        function init() {
            loadCart(); // This will load cart and update UI
            renderHomePage();
            renderShopAllPage();
            renderBrandPage();
            renderFAQs();
            createParticles();
            renderReviews();
            renderWhyCarousel();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
